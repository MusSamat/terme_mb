name: tappjet_mb
description: Tappjet — native mobile client (iOS + Android). Port of tappjet_ft.
publish_to: "none"
version: 1.1.0+8

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP
  dio: ^5.5.0
  retrofit: ^4.1.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Realtime
  socket_io_client: ^2.0.3+1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # flutter_secure_storage: its Linux plugin bundles an old json.hpp that fails
  # to compile under modern Clang (-Werror). Re-enable when implementing token
  # persistence / testing on Android+iOS (where it builds fine). ТЗ §5.5.
  # flutter_secure_storage: ^9.2.2

  # i18n
  easy_localization: ^3.0.7
  intl: ^0.20.2 # must match the version flutter_localizations pins

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Media
  camera: ^0.11.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Icons: web uses lucide-react. The old `lucide_icons` pkg subclasses
  # IconData (now a final class) and won't compile — when wiring real icons,
  # add the maintained `lucide_icons_flutter` instead. Skeleton uses Material.

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Misc
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.5 # offline banner (online/offline events)

# easy_localization 3.0.7 caps intl below 0.20.0, but the Flutter SDK pins
# intl 0.20.2. The APIs used are compatible, so force the SDK version.
dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences: ^2.5.5 # used by smoke_test to mock easy_localization prefs
  flutter_launcher_icons: ^0.14.1
  mocktail: ^1.0.5

# App/PWA icons from the brand mark. Regenerate: dart run flutter_launcher_icons
# (source PNG built by test/gen_app_icon_test.dart). Enable android/ios once
# those platform folders are generated via `flutter create`.
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  web:
    generate: true
    background_color: "#0D9488"
    theme_color: "#0D9488"
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/images/

  fonts:
    # Manrope — single family for the whole app (excellent Cyrillic; replaces
    # Fredoka which had none, and Nunito). Variable TTF covers 200–800.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
